# Anchor Ledger Nginx Configuration
# Single public entry point for the entire application

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name anchorledger.duckdns.org anchorledger.space www.anchorledger.space;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    server_name anchorledger.duckdns.org ;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/anchorledger.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchorledger.duckdns.org/privkey.pem;

    # SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Docker's embedded DNS - without this, nginx resolves upstream
    # hostnames (api, frontend) ONCE at config-load and caches the IP
    # forever. Recreating a container gives it a new IP, so every deploy
    # silently 502'd until a manual `nginx -s reload`. Using a variable in
    # each proxy_pass forces nginx to re-resolve via this resolver instead
    # of caching indefinitely.
    resolver 127.0.0.11 valid=10s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    # ── Socket.io — must come before /api to match /socket.io path
    location /socket.io/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── API — proxy to Express backend
    location /api/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Hide internal headers
        proxy_hide_header X-Powered-By;
    }

    # ── Health check (internal use only — not exposed in UI)
    location /health {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Frontend — serve React production build
    location / {
        set $upstream_frontend frontend:80;
        proxy_pass         http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache static assets aggressively
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}

# HTTPS — anchorledger.space (real domain, own cert, same upstreams as above)
server {
    listen 443 ssl;
    server_name anchorledger.space www.anchorledger.space;

    ssl_certificate     /etc/letsencrypt/live/anchorledger.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchorledger.space/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    resolver 127.0.0.11 valid=10s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    location /socket.io/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
    }

    location /health {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        set $upstream_frontend frontend:80;
        proxy_pass         http://$upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
