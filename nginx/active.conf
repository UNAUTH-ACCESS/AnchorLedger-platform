# JAP Console — HTTP: ACME challenge + redirect to HTTPS.
# Private admin tool (SMM order desk). Flask service: systemd unit
# jap-console, localhost:8081. Separate site, same nginx.
server {
    listen 80;
    server_name jap-console.139-162-181-164.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# JAP Console — HTTPS. Basic-auth gate in front of the app's own login,
# noindex, proxies to the host systemd service on localhost:8081.
server {
    listen 443 ssl;
    server_name jap-console.139-162-181-164.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/jap-console.139-162-181-164.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jap-console.139-162-181-164.sslip.io/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           no-referrer                           always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive"        always;

    auth_basic           "JAP Console";
    auth_basic_user_file /etc/nginx/.htpasswd-jap;

    client_max_body_size 4m;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass         http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
