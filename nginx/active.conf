# Rate-limit zone for the JAP Console login (its only auth gate).
limit_req_zone $binary_remote_addr zone=jap_login:1m rate=10r/m;

# Anchor Ledger Nginx Configuration
# Single public entry point for the entire application

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name anchorledger.duckdns.org anchorledger.space www.anchorledger.space;
    server_tokens off;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Situation Wire — HTTP: ACME challenge + redirect to HTTPS.
server {
    listen 80;
    server_name situationwire.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Situation Wire — HTTPS. Proxies to the Node service running on the host
# (systemd unit situation-wire, localhost:3000) via the docker host-gateway.
# Not part of the Anchor Ledger app — separate site, same nginx.
server {
    listen 443 ssl;
    server_name situationwire.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/situationwire.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/situationwire.duckdns.org/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;

    # Cover media: images capped at 10MB, videos at 64MB in the app.
    client_max_body_size 72m;

    location / {
        proxy_pass         http://host.docker.internal:3000;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}

# HTTPS — legacy DuckDNS domain: redirect-only.
# Was the real content host as a pre-launch stopgap; now that
# anchorledger.space is live, serving identical app content on both was a
# real duplicate-content problem - Google Search Console flagged the
# canonical URL as "Duplicate without user-selected canonical" because of
# exactly this (plus the www split below). A redirect is a hard signal
# search engines trust; a <link rel="canonical"> tag alone is only a hint.
server {
    listen 443 ssl;
    server_name anchorledger.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/anchorledger.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchorledger.duckdns.org/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://anchorledger.space$request_uri;
    }
}

# HTTPS — www: redirect-only, same reason as above. The cert already
# covers both as SANs (issued together), so no separate cert is needed
# just to terminate TLS before redirecting.
server {
    listen 443 ssl;
    server_name www.anchorledger.space;

    ssl_certificate     /etc/letsencrypt/live/anchorledger.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchorledger.space/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://anchorledger.space$request_uri;
    }
}

# HTTPS — anchorledger.space: the one canonical content-serving host.
server {
    listen 443 ssl;
    server_name anchorledger.space;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/anchorledger.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchorledger.space/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # ipv6=off: this container's docker network has no IPv6 route (the host
    # does, the bridge network doesn't) — without this, nginx round-robins
    # into unauth-access.github.io's AAAA records first, gets an instant
    # "Network unreachable" on each, and the accumulated failures across
    # the 3-hop Pages fallback chain below exhaust nginx's own retries
    # before ever reaching a working IPv4 address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                                   always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;
    # Structural hardening that can't break the SPA or its opt-in third
    # parties: no plugin content, no <base> hijack, forms can only post to
    # our own origin, and framing is same-origin only (mirrors X-Frame-
    # Options for browsers that prefer CSP). Script/style/connect are left
    # unrestricted here — a full source-list CSP needs its own tested pass
    # against the consent-gated PostHog + Smartsupp integrations.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location /socket.io/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
        # helmet already sends its own CSP on API responses; drop it so
        # clients don't get two Content-Security-Policy headers (the
        # server-level one below still applies).
        proxy_hide_header Content-Security-Policy;
    }

    location /health {
        set $upstream_api api:3000;
        proxy_pass         http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Frontend serving moved off the VPS to GitHub Pages (2026-09-12) — see
    # .github/workflows/deploy-pages.yml, which builds frontend/ and
    # publishes it on every push. Vite emits root-absolute asset paths
    # (/assets/...), which is exactly right here: the browser only ever
    # sees anchorledger.space as the origin, so those resolve correctly
    # through this proxy without any base-path rewriting.
    #
    # $pages_host as a variable (not a literal in proxy_pass) forces nginx
    # to actually use the `resolver` above instead of caching the IP at
    # config-load time forever — GitHub's Pages IPs are Fastly-backed and
    # do rotate.
    #
    # Rollback: the local `frontend` container is still built/deployed and
    # running (docker compose start frontend) as an immediate fallback —
    # swap this location back to `proxy_pass http://$upstream_frontend;`
    # (upstream_frontend=frontend:80) if Pages ever needs to be bypassed.
    # ─────────────────────────────────────────────────────────────────────
    # Two-step chain. Pages' own 404.html (a copy of index.html — see
    # deploy-pages.yml) already IS the SPA-fallback mechanism: any path
    # with no matching file gets the app shell back with a 404 status,
    # which is fine for client-only routes (/login, /dashboard) that
    # shouldn't be indexed anyway. The one thing nginx still has to do:
    # catch Pages' extensionless-path redirect (/blog -> /blog/) before it
    # ever reaches a client — unintercepted, it would send the browser to
    # unauth-access.github.io directly, breaking same-origin — and instead
    # fetch that route's own index.html so prerendered marketing/blog pages
    # render directly with a real 200, no redirect hop (needed for OG/
    # social-unfurl bots that don't follow redirects).
    location / {
        set $pages_host unauth-access.github.io;
        proxy_pass         https://$pages_host/AnchorLedger-platform$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host       $pages_host;
        proxy_ssl_server_name on;
        proxy_ssl_name     $pages_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect     https://$pages_host/AnchorLedger-platform/ /;
        proxy_intercept_errors on;
        error_page 301 302 = @pages_dir_index;
    }

    location @pages_dir_index {
        set $pages_host unauth-access.github.io;
        proxy_pass         https://$pages_host/AnchorLedger-platform${uri}/index.html$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host       $pages_host;
        proxy_ssl_server_name on;
        proxy_ssl_name     $pages_host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}

