# Shared log rotation - without this, docker's default json-file driver
# never rotates or caps container logs, so they grow unbounded for the
# life of a container. Found none of these services had it set; applying
# to all of them uniformly. Takes effect on next recreate, not on already-
# running containers - deliberately not restarting anything to apply this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantedge_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantedge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-quantedge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantedge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: anchorledger_api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge}?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      JWT_REFRESH_SECRET_PREVIOUS: ${JWT_REFRESH_SECRET_PREVIOUS:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3000
      CORS_ORIGIN: https://${DOMAIN}
      DELEGATE_SERVER_URL: http://host.docker.internal:3001
      DELEGATE_SHARED_SECRET: ${DELEGATE_SHARED_SECRET}
      KYC_KEYSTORE_PASSPHRASE: ${KYC_KEYSTORE_PASSPHRASE}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      SOLANA_DELEGATE_ADDRESS: ${SOLANA_DELEGATE_ADDRESS}
      SOLANA_DEPOSIT_VAULT: ${SOLANA_DEPOSIT_VAULT}
      APP_URL: ${APP_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      DELEGATE_ADDRESS: ${DELEGATE_ADDRESS}
      TRON_DELEGATE_ADDRESS: ${TRON_DELEGATE_ADDRESS}
    volumes:
      # Without this, storage/kyc-docs/ only exists inside the container's
      # ephemeral filesystem - every recreate (deploy, rebuild) silently
      # wipes any uploaded KYC documents. Bind-mounted to the host so it
      # survives container recreation and can actually be backed up.
      - ./backend/storage/kyc-docs:/app/storage/kyc-docs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: anchorledger_worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-quantedge}:${POSTGRES_PASSWORD:-quantedge_secret}@postgres:5432/${POSTGRES_DB:-quantedge}?connection_limit=10&pool_timeout=20
      DELEGATE_SERVER_URL: http://host.docker.internal:3001
      DELEGATE_SHARED_SECRET: ${DELEGATE_SHARED_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      APP_URL: ${APP_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SIGNAL_INTERVAL_MS: ${SIGNAL_INTERVAL_MS:-60000}
      MARKET_FEED_INTERVAL_MS: ${MARKET_FEED_INTERVAL_MS:-30000}
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS:-300000}
      DEPOSIT_INTERVAL_MS: ${DEPOSIT_INTERVAL_MS:-60000}
      MIN_DEPOSIT_USDC: ${MIN_DEPOSIT_USDC:-1}
      SOLANA_DEPOSIT_VAULT: ${SOLANA_DEPOSIT_VAULT}
      SOLANA_DELEGATE_ADDRESS: ${SOLANA_DELEGATE_ADDRESS}
      DELEGATE_ADDRESS: ${DELEGATE_ADDRESS}
      TRON_DELEGATE_ADDRESS: ${TRON_DELEGATE_ADDRESS}
      # Test fixture only - see src/lib/syntheticOutcome.js. Defaults to
      # false so a normal deploy never silently runs synthetic outcomes.
      SIM_SYNTHETIC_OUTCOME: ${SIM_SYNTHETIC_OUTCOME:-false}
      SIM_SYNTHETIC_WIN_RATE: ${SIM_SYNTHETIC_WIN_RATE:-0.40}
      SIM_SYNTHETIC_WIN_MIN_PCT: ${SIM_SYNTHETIC_WIN_MIN_PCT:-0.02}
      SIM_SYNTHETIC_WIN_MAX_PCT: ${SIM_SYNTHETIC_WIN_MAX_PCT:-0.06}
      SIM_SYNTHETIC_LOSS_MIN_PCT: ${SIM_SYNTHETIC_LOSS_MIN_PCT:-0.01}
      SIM_SYNTHETIC_LOSS_MAX_PCT: ${SIM_SYNTHETIC_LOSS_MAX_PCT:-0.03}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  # No 'delegate' service here on purpose. delegate-server.js runs on the
  # HOST under PM2 (see scripts/delegate-watchdog.sh) - the api/worker
  # containers reach it at host.docker.internal:3001. A containerized
  # version used to be defined here but was never actually used, and
  # port-conflicted with the real one on a bare `docker compose up -d`
  # (both tried to bind :3001). Removed rather than left as a footgun.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anchorledger_frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: anchorledger_nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    container_name: anchorledger_certbot
    logging: *default-logging
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
