server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for all non-asset routes.
    # $uri/index.html (a file check), not $uri/ (a directory check) — the
    # latter makes nginx 301-redirect /architecture -> /architecture/ before
    # serving it, since prerender-seo.js's dist/<route>/index.html output
    # makes $uri/ resolve to a real directory. Checking the file directly
    # serves it with no redirect at all, exactly as required for OG/social
    # unfurl bots that don't follow redirects before reading meta tags.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Aggressive cache for hashed assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
