<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor Ledger</title>
    <meta name="description" content="Multi-chain algorithmic trading with scoped, revocable wallet permissions — never custody." />
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores manifest.json's display:standalone - these are the
         actual mechanism Safari's "Add to Home Screen" reads for it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anchor Ledger" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById("root").innerHTML = '<div style="background:#0A0A0F;color:#FF4D6D;padding:20px;font-family:monospace;font-size:11px;white-space:pre-wrap;word-break:break-all">' + msg + "\n\n" + (src||"") + ":" + line + "\n\n" + ((err&&err.stack)||"") + "</div>";
    };
    window.addEventListener("unhandledrejection", function(e) {
      document.getElementById("root").innerHTML = '<div style="background:#0A0A0F;color:#FF4D6D;padding:20px;font-family:monospace;font-size:11px;white-space:pre-wrap;word-break:break-all">Unhandled rejection:\n\n' + ((e.reason&&e.reason.stack)||e.reason||"unknown") + "</div>";
    });
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
