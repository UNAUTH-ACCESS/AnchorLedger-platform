name: deploy-pages

# Builds the frontend and publishes it to GitHub Pages, so static asset
# serving and bandwidth move off the VPS entirely. This is a NEW, currently
# unused hosting target — the production edge nginx on the VPS does not
# point at it yet. Cutting anchorledger.space's routing over to this is a
# separate, deliberate step (see ops notes), not automatic on merge.

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        # npm install, not `npm ci`: same cross-npm-version lockfile drift
        # as the backend (see backend/Dockerfile's comment).
        run: npm install --no-audit --no-fund

      - name: Build (vite build + prerender-seo)
        working-directory: frontend
        run: npm run build

      - name: SPA fallback for GitHub Pages
        # Pages has no server-side rewrite rule — it serves 404.html
        # verbatim (status 404) for any path with no matching file. Making
        # that file a copy of index.html is the standard SPA-on-Pages
        # pattern: client-only routes (e.g. /dashboard, /login) still
        # render the app, just under a 404 status, which is fine for
        # routes that shouldn't be indexed anyway. Prerendered marketing/
        # blog routes are real files and never hit this path.
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
